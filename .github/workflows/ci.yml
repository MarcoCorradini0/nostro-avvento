# CI: esegue i test a ogni push e pull request.
# Se i test sono verdi su main, il job "deploy" avvia il deploy su Render (Deploy Hook).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull request: se fai due push di fila, la CI del primo viene annullata.
# Su main invece no: ogni push fa il suo deploy (altrimenti un push "solo README"
# subito dopo una modifica al codice annullerebbe il deploy di quella modifica).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Cache di Gradle e dipendenze tra un'esecuzione e l'altra.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test

  # Deploy su Render: parte solo su main, solo se i test sono verdi
  # e solo se e' cambiato qualcosa che finisce nell'immagine Docker.
  # (Render non riceve i push da GitHub, quindi lo avvisiamo noi col Deploy Hook.)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            image:
              - 'src/**'
              - 'web/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'Dockerfile'
              - 'advent.example.json'

      - name: Avvia il deploy su Render
        if: steps.changes.outputs.image == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Manca il secret RENDER_DEPLOY_HOOK: deploy saltato."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy avviato su Render."
