# CI: esegue i test a ogni push e pull request.
# Render fa il deploy solo se questo controllo e' verde (autoDeployTrigger: checksPass).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Se fai due push di fila, la CI del primo viene annullata: niente lavoro inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Cache di Gradle e dipendenze tra un'esecuzione e l'altra.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test
