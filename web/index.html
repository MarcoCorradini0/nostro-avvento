<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>Il nostro Avvento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <header>
    <h1>Il nostro Avvento</h1>
    <p id="greeting" class="sub">&nbsp;</p>
    <div id="presence" class="presence" hidden aria-live="polite"></div>
  </header>

  <main>
    <div id="loader" class="loader" hidden>
      <div class="loader-icon" aria-hidden="true">⛄</div>
      <p id="loader-text">Sto svegliando il calendario…</p>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p id="error" class="error" hidden></p>

    <section id="view-advent" aria-label="Calendario dell'avvento">
      <div id="grid" class="grid"></div>
    </section>

    <section id="view-meetings" aria-label="Incontri" hidden>
      <button id="new-meeting" class="btn" type="button">＋ Proponi un giorno</button>
      <div id="meetings" class="meetings"></div>
    </section>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-view="advent" class="active">🎄<span>Avvento</span></button>
    <button type="button" data-view="meetings">📅<span>Incontri</span><b id="badge" class="badge" hidden></b></button>
  </nav>

  <dialog id="door-dialog">
    <article>
      <p id="dlg-day" class="dlg-day"></p>
      <div id="dlg-icon" class="dlg-icon"></div>
      <h2 id="dlg-title"></h2>
      <p id="dlg-text" class="dlg-text"></p>
      <a id="dlg-link" class="btn" target="_blank" rel="noopener noreferrer" hidden>Apri</a>
      <button id="dlg-close" class="btn secondary" type="button">Chiudi</button>
    </article>
  </dialog>

  <dialog id="meeting-dialog">
    <form id="meeting-form" method="dialog">
      <h2 id="mf-title">Proponi un giorno</h2>
      <label>Quando
        <input id="mf-date" type="date" required>
      </label>
      <label>Cosa facciamo?
        <textarea id="mf-text" rows="6" placeholder="Idee, posti, orari… (max 200 parole)"></textarea>
      </label>
      <p id="mf-count" class="counter">0 / 200 parole</p>
      <button class="btn" type="submit" id="mf-send">Invia</button>
      <button class="btn secondary" type="button" id="mf-cancel">Annulla</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
