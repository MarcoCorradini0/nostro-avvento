  <canvas id="snow" aria-hidden="true"></canvas>

  <!-- Schermata iniziale: un paio di secondi, poi sfuma -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-hearts"><span class="s-left">💙</span><span class="s-right">💜</span></div>
    <p class="splash-title">Il nostro Avvento</p>
    <p id="splash-sub" class="splash-sub">&nbsp;</p>
  </div>

    <p id="greeting" class="sub">&nbsp;</p>

    <p id="together" class="together" hidden>💙 Siete qui insieme 💜</p>

      <div id="grid" class="grid"></div>
    </section>

    <section id="view-photos" aria-label="I nostri ricordi" hidden>
      <label class="btn" for="photo-input">＋ Aggiungi foto</label>
      <input id="photo-input" class="visually-hidden" type="file" accept="image/*" multiple>
      <div class="collage-head"><h2>I nostri ricordi</h2><span id="photo-count"></span></div>
      <div id="collage" class="collage"></div>
    </section>

    <section id="view-meetings" aria-label="Incontri" hidden>
      <button id="new-meeting" class="btn" type="button">＋ Proponi un giorno</button>
      <div id="meetings" class="meetings"></div>
    </section>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-view="advent" class="active">🎄<span>Avvento</span></button>
    <button type="button" data-view="photos">📷<span>Ricordi</span></button>
    <button type="button" data-view="meetings">📅<span>Incontri</span><b id="badge" class="badge" hidden></b></button>
  </nav>

  <dialog id="door-dialog">
    <article>
      <p id="dlg-day" class="dlg-day"></p>
      <div id="dlg-icon" class="dlg-icon"></div>
      <div id="dlg-anim" class="anim" aria-hidden="true" hidden></div>
      <img id="dlg-photo" class="dlg-photo" alt="Una nostra foto" hidden>
      <h2 id="dlg-title"></h2>
      <p id="dlg-text" class="dlg-text"></p>
      <a id="dlg-link" class="btn" target="_blank" rel="noopener noreferrer" hidden>Apri</a>
      <button id="dlg-close" class="btn secondary" type="button">Chiudi</button>
    </article>
  </dialog>

  <dialog id="meeting-dialog">
    <form id="meeting-form" method="dialog">
      <h2 id="mf-title">Proponi un giorno</h2>
      <div class="mf-when">
        <label><span>Giorno</span>
          <input id="mf-date" type="date" required>
        </label>
        <label><span>Ora <small>(facoltativa)</small></span>
          <input id="mf-time" type="time">
        </label>
      </div>
      <label>Cosa facciamo?
        <textarea id="mf-text" rows="6" placeholder="Idee, posti, orari… (max 200 parole)"></textarea>
      </label>
      <p id="mf-count" class="counter">0 / 200 parole</p>
      <button class="btn" type="submit" id="mf-send">Invia</button>
      <button class="btn secondary" type="button" id="mf-cancel">Annulla</button>
    </form>
  </dialog>

  <dialog id="photo-dialog" class="photo-dialog">
    <img id="pv-img" alt="Una nostra foto">
    <p id="pv-who" class="pv-who"></p>
    <div class="pv-actions">
      <button id="pv-delete" class="btn secondary" type="button">Togli la foto</button>
      <button id="pv-close" class="btn" type="button">Chiudi</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
