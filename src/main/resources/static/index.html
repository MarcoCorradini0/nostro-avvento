<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>Il nostro Avvento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <header>
    <h1>Il nostro Avvento</h1>
    <p id="greeting" class="sub">&nbsp;</p>
  </header>

  <main>
    <p id="error" class="error" hidden></p>
    <div id="grid" class="grid" aria-label="Caselle del calendario"></div>
  </main>

  <dialog id="door-dialog">
    <article>
      <p id="dlg-day" class="dlg-day"></p>
      <div id="dlg-icon" class="dlg-icon"></div>
      <h2 id="dlg-title"></h2>
      <p id="dlg-text" class="dlg-text"></p>
      <a id="dlg-link" class="btn" target="_blank" rel="noopener noreferrer" hidden>Apri</a>
      <button id="dlg-close" class="btn secondary" type="button">Chiudi</button>
    </article>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
